services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certificados
      POSTGRES_PASSWORD: certificados
      POSTGRES_DB: certificados
    # Host 5434: this machine already listens on 5432.
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certificados -d certificados"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Official minio/minio is no longer public on Docker Hub.
  # Bitnami legacy publishes the same server; the API creates the bucket on startup.
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  postgres_data:
  minio_data:
