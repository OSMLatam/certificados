# Seed: country_identity_config (Colombia initial)
# normalize is per document type (digits | alnum | raw), not hardcoded by country.
country_code: CO
document_types:
  - code: CC
    label: Cédula de ciudadanía
    normalize: digits
    validation_regex: "^[0-9]{6,10}$"
    display_order: 1
  - code: CE
    label: Cédula de extranjería
    normalize: digits
    validation_regex: "^[0-9]{6,10}$"
    display_order: 2
  - code: TI
    label: Tarjeta de identidad
    normalize: digits
    validation_regex: "^[0-9]{10,11}$"
    display_order: 3
