map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    root /usr/share/nginx/html;
    # Compose DNS. A variable keeps nginx from failing when the API name
    # is not resolvable at configuration load.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:3000;

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /health {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /ready {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /robots.txt {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location = / {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /privacy {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /about {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /help {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location /c/ {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy-headers.conf;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        expires 7d;
    }

    location = /admin {
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }

    location /admin/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
